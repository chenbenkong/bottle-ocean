<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const SEA = -0.62;
const TAU = Math.PI * 2;

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,-0.35,0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 15;
controls.maxDistance = 38;
controls.minPolarAngle = 0.32;
controls.maxPolarAngle = Math.PI * 0.515;

let seed = 160;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const clamp=THREE.MathUtils.clamp;
const lerp=THREE.MathUtils.lerp;
const unitBox = new THREE.BoxGeometry(1,1,1);
const voxelMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:.78,metalness:.04});
const glowMat = new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false});
const tempObj = new THREE.Object3D();
const tempColor = new THREE.Color();
class VoxelBatch{
  constructor(){this.items=[];}
  add(x,y,z,sx,sy,sz,color,rx=0,ry=0,rz=0){this.items.push({x,y,z,sx,sy,sz,color,rx,ry,rz});return this;}
  build(parent,{glow=false,shadow=true,name='voxels'}={}){
    const mesh=new THREE.InstancedMesh(unitBox,glow?glowMat:voxelMat,this.items.length);
    mesh.name=name;
    for(let i=0;i<this.items.length;i++){
      const v=this.items[i];tempObj.position.set(v.x,v.y,v.z);tempObj.scale.set(v.sx,v.sy,v.sz);tempObj.rotation.set(v.rx,v.ry,v.rz);tempObj.updateMatrix();
      mesh.setMatrixAt(i,tempObj.matrix);mesh.setColorAt(i,tempColor.set(v.color));
    }

}
function mesh(geo,mat,parent,pos=[0,0,0],rot=[0,0,0]){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.rotation.set(...rot);parent.add(m);return m;}
function cylinderBetween(a,b,r,mat,parent,segments=8){
  const av=new THREE.Vector3(...a),bv=new THREE.Vector3(...b),d=bv.clone().sub(av);

  m.position.copy(av.add(bv).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.castShadow=true;return m;
}
function radiusAt(x){
  if(x<-5.82||x>7.9)return 0;
  if(x<4.45)return 3.18;
  if(x<5.95)return lerp(3.18,1.02,(x-4.45)/1.5);
  return 1.02;
}
function insideBottle(p,margin=.12){
  const r=radiusAt(p.x)-margin;if(r<=0)return false;
  return p.y*p.y+p.z*p.z<=r*r;
}
const WAVES=[
  {dx:0.94,dz:0.34,k:1.1,a:0.085,w:1.3,q:0.55},
  {dx:-0.37,dz:0.93,k:1.85,a:0.05,w:1.85,q:0.5},
  {dx:0.71,dz:-0.71,k:3.05,a:0.028,w:2.25,q:0.4},
  {dx:0.2,dz:0.98,k:5.1,a:0.016,w:2.9,q:0.3},
];

}

const hemi=new THREE.HemisphereLight(0xd9c39b,0x27383a,1.45);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffc681,3.2);key.position.set(-8,12,9);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-15;key.shadow.camera.right=15;key.shadow.camera.top=12;key.shadow.camera.bottom=-10;key.shadow.bias=-.0006;scene.add(key);

for(let z=-5;z<=5;z+=1){tableVox.add(0,-4.55,z,23,.48,.94,z%2?0x503426:0x593a28);for(let g=0;g<3;g++)tableVox.add(-9+rnd()*18,-4.302,z-.32+rnd()*.64,.7+rnd()*2,.012,.018,0x291a13);}

  stand.add(x,-4.05,0,1.15,.5,6.0,0x382419);

}

for(const x of[-3,0,3])windowFrame.add(x,0,.05,.15,7.2,.18,0x241a14);
for(const y of[-3.5,0,3.5])windowFrame.add(0,y,.05,6.2,.15,.18,0x241a14);

// 旧书
const books=new THREE.Group();books.position.set(-8.1,-4.03,1.5);books.rotation.y=-.16;room.add(books);
const bookColors=[0x35433b,0x6b352b,0x3b3030];
for(let i=0;i<3;i++){

  mesh(new THREE.BoxGeometry(3.1,.28,2.15),new THREE.MeshStandardMaterial({color:bookColors[i],roughness:.9}),b);

const telescope=new THREE.Group();telescope.position.set(7.3,-3.95,2.85);telescope.rotation.y=-.55;room.add(telescope);

const bottleRoot=new THREE.Group();bottleRoot.position.y=.2;scene.add(bottleRoot);
const innerWorld=new THREE.Group();bottleRoot.add(innerWorld);

const profile=[new THREE.Vector2(0,-6.02),new THREE.Vector2(2.85,-6.02),new THREE.Vector2(3.18,-5.82),new THREE.Vector2(3.27,-5.5),new THREE.Vector2(3.27,4.35),new THREE.Vector2(3.18,4.7),new THREE.Vector2(2.8,5.12),new THREE.Vector2(2.05,5.55),new THREE.Vector2(1.15,5.92),new THREE.Vector2(1.02,6.18),new THREE.Vector2(1.02,7.95),new THREE.Vector2(1.13,8.03)];

  transparent:true,depthWrite:false,side:THREE.DoubleSide,

});

function particlePool(count,color,size,parent){const m=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(size*.85,1),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.62,depthWrite:false}),count);m.frustumCulled=false;m.renderOrder=5;parent.add(m);return {mesh:m,items:Array.from({length:count},()=>({p:new THREE.Vector3(0,-20,0),v:new THREE.Vector3(),life:0,max:1})),cursor:0};}
const spray=particlePool(72,0xc5eee5,.055,innerWorld);const wake=particlePool(110,0xd0e8d9,.075,innerWorld);
const rain=particlePool(150,0xbcd8e8,.028,innerWorld);
for(const it of rain.items){it.p.set(-5+rnd()*12,.3+rnd()*1.7,(rnd()-.5)*2.8);it.life=99;}
function updateRain(dt){
  const s=state.storm;rain.mesh.visible=s>.04;if(!rain.mesh.visible)return;
  for(const it of rain.items){if(dt>0){it.p.y-=dt*(1.9+s*3.4);it.p.x+=dt*.3*s;if(it.p.y<SEA){it.p.set(-5+rnd()*12,1.85+rnd()*.4,(rnd()-.5)*2.8);}
    const r=radiusAt(it.p.x)-.12;if(r>0){const rad=Math.hypot(it.p.y,it.p.z);if(rad>r)it.p.y=Math.sqrt(Math.max(.1,r*r-it.p.z*it.p.z))-.04;}}}
  let n=0;for(const it of rain.items){tempObj.position.copy(it.p);tempObj.scale.set(.5,2.4+s*1.8,.5);tempObj.rotation.set(0,0,0);tempObj.updateMatrix();rain.mesh.setMatrixAt(n++,tempObj.matrix);}
  rain.mesh.instanceMatrix.needsUpdate=true;rain.mesh.material.opacity=Math.min(.65,s*.8);
}
function emit(pool,p,v,life){const it=pool.items[pool.cursor++%pool.items.length];it.p.copy(p);it.v.copy(v);it.life=life;it.max=life;}
function updateParticles(pool,dt,gravity=0){for(let i=0;i<pool.items.length;i++){const it=pool.items[i];if(it.life>0){it.life-=dt;it.v.y-=gravity*dt;it.p.addScaledVector(it.v,dt);const sc=clamp(it.life/it.max,0,1);tempObj.position.copy(it.p);tempObj.scale.setScalar(sc);}else{tempObj.position.set(0,-20,0);tempObj.scale.setScalar(0);}tempObj.rotation.set(0,0,0);tempObj.updateMatrix();pool.mesh.setMatrixAt(i,tempObj.matrix);}pool.mesh.instanceMatrix.needsUpdate=true;}

// 海鸥：六只，翼展与飞行高度均留瓶内余量

for(let i=0;i<6;i++){const g=new THREE.Group();innerWorld.add(g);const b=new VoxelBatch();b.add(0,0,0,.12,.1,.28,0xe5e1d5);b.add(0,.04,.16,.1,.1,.1,0xf0ebdd);b.add(0,.02,.24,.045,.035,.08,0xc99b55);b.build(g,{shadow:false});const lw=mesh(new THREE.BoxGeometry(.36,.035,.13),birdMat,g,[-.2,.02,0]);const rw=mesh(new THREE.BoxGeometry(.36,.035,.13),birdMat,g,[.2,.02,0]);birds.push({g,lw,rw,phase:i/6*TAU,r:1.7+(i%3)*.38,h:1.55+(i%2)*.32});}

// 鱼群：单次实例绘制，水下环绕
const fishCount=36;const fishMesh=new THREE.InstancedMesh(unitBox,new THREE.MeshStandardMaterial({color:0x9fc5ae,roughness:.7,metalness:.15}),fishCount*2);fishMesh.name='鱼群';innerWorld.add(fishMesh);
const fishData=Array.from({length:fishCount},(_,i)=>({phase:i/fishCount*TAU,r:.8+(i%9)*.11,y:-1.1-(i%5)*.2,speed:.25+(i%3)*.05,center:new THREE.Vector3(i<18?2.2:-3.4,0,i<18?-.4:.8)}));

// 瓶内日月与星空
const celestial=new THREE.Group();innerWorld.add(celestial);
const sunMat=new THREE.MeshBasicMaterial({color:0xffc55d,transparent:true,toneMapped:false});const moonMat=new THREE.MeshBasicMaterial({color:0xd9e4dc,transparent:true,toneMapped:false});
const sun=mesh(new THREE.IcosahedronGeometry(.18,1),sunMat,celestial);const moon=mesh(new THREE.IcosahedronGeometry(.16,1),moonMat,celestial);
const starPos=[];for(let i=0;i<150;i++){const x=-5+rnd()*9.2;const a=.18+rnd()*(Math.PI-.36);const r=2.85;const y=Math.abs(Math.sin(a))*r;const z=Math.cos(a)*r;if(y*y+z*z<radiusAt(x)**2)starPos.push(x,y,z);}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));const starMat=new THREE.PointsMaterial({color:0xe6e5d4,size:.035,transparent:true,opacity:0,depthWrite:false});const stars=new THREE.Points(starGeo,starMat);stars.renderOrder=1;innerWorld.add(stars);
// 瓶内闪电
const lightning=new THREE.Group();innerWorld.add(lightning);const lightningMat=new THREE.LineBasicMaterial({color:0xcfe8ff,transparent:true,opacity:0,blending:THREE.AdditiveBlending});
for(let n=0;n<3;n++){const pts=[];let x=-1.8+n*1.7,y=2.62,z=-.15;pts.push(new THREE.Vector3(x,y,z));for(let j=0;j<6;j++){x+=(rnd()-.5)*.25;y-=.18+rnd()*.12;z+=(rnd()-.5)*.12;pts.push(new THREE.Vector3(x,y,z));}const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),lightningMat);lightning.add(l);}
const stormLight=new THREE.PointLight(0xa9d7ff,0,7,2);stormLight.position.set(0,2,0);innerWorld.add(stormLight);

const state={speed:1,storm:0,stormTarget:0,stormLevel:0,day:.71,time:0,real:0,shipAngle:.85,fps:0,lightning:0};
const phaseEl=document.getElementById('phase'),speedEl=document.getElementById('speedRead'),fpsEl=document.getElementById('fps'),sailingEl=document.getElementById('sailing'),stormBanner=document.getElementById('stormBanner');
function setSpeed(v){state.speed=v;speedEl.textContent=v===0?'暂停':'× '+v;document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active',Number(b.dataset.speed)===v));}
document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>setSpeed(Number(b.dataset.speed))));
function setStormLevel(v){
  state.stormLevel=v;state.stormTarget=v/2;
  document.querySelectorAll('[data-storm]').forEach(b=>b.classList.toggle('active',Number(b.dataset.storm)===v));
  sailingEl.textContent=['绕岛巡航','迎风颠簸','飓风肆虐'][v]||'绕岛巡航';
  stormBanner.textContent=v===2?'飓 风 正 在 登 陆':'风 暴 正 在 经 过';
  stormBanner.classList.toggle('on',v>0);
}
document.querySelectorAll('[data-storm]').forEach(b=>b.addEventListener('click',()=>{const v=Number(b.dataset.storm);setStormLevel(state.stormLevel===v?0:v);}));
function resetScene(){
  setSpeed(1);setStormLevel(0);state.storm=0;state.stormTarget=0;
  state.day=.71;state.time=0;state.real=0;state.shipAngle=.85;state.lightning=0;
  camera.position.set(12.5,7.4,22.5);controls.target.set(0,-.35,0);controls.autoRotate=true;controls.update();
  bottleRoot.rotation.set(0,0,0);innerWorld.quaternion.identity();
  for(const pool of[spray,wake,rain])for(const it of pool.items)it.life=0;
  waterUniforms.uTime.value=0;volumeMat.uniforms.uTime.value=0;waterUniforms.uStorm.value=0;
  renderer.toneMappingExposure=1.05;updateDay(0);updateShip(0);updateDynamics(0);updateRain(0);
}
document.getElementById('resetBtn').addEventListener('click',resetScene);
renderer.domElement.addEventListener('pointerdown',()=>{if(document.activeElement)document.activeElement.blur();});

const skyStops={dawn:new THREE.Color(0x70504a),day:new THREE.Color(0x456e72),dusk:new THREE.Color(0x5c4035),night:new THREE.Color(0x101b2c)};
function dayWeights(p){
  // 0 子夜、.25 黎明、.5 正午、.75 黄昏
  const dawn=Math.max(0,1-Math.abs(p-.25)/.25);const day=Math.max(0,1-Math.abs(p-.5)/.25);const dusk=Math.max(0,1-Math.abs(p-.75)/.25);const night=Math.max(0,1-Math.min(p,1-p)/.25);
  return {dawn,day,dusk,night};
}
let shipPitch=0,shipRoll=0,wakeTimer=0,frameCount=0,fpsTime=0,lowFpsTime=0;
const shipPos=new THREE.Vector3(),shipPrev=new THREE.Vector3(),forward=new THREE.Vector3(),right=new THREE.Vector3();
function updateShip(dt){
  state.shipAngle=(state.shipAngle+dt*.105)%TAU;const a=state.shipAngle;
  const x=-1.75+Math.cos(a)*3.25,z=.05+Math.sin(a)*1.82;
  const dx=-Math.sin(a)*3.25,dz=Math.cos(a)*1.82;const heading=Math.atan2(dx,dz);
  shipPrev.copy(shipPos);shipPos.set(x,SEA,z);ship.position.copy(shipPos);
  forward.set(dx,0,dz).normalize();right.set(forward.z,0,-forward.x);
  const bow=waveHeight(x+forward.x*.82,z+forward.z*.82,state.time,state.storm);
  const stern=waveHeight(x-forward.x*.72,z-forward.z*.72,state.time,state.storm);
  const port=waveHeight(x-right.x*.4,z-right.z*.4,state.time,state.storm);
  const star=waveHeight(x+right.x*.4,z+right.z*.4,state.time,state.storm);
  ship.position.y=SEA+(bow+stern+port+star)/4+.07;
  shipPitch=lerp(shipPitch,-Math.atan2(bow-stern,1.54),1-Math.exp(-dt*4));shipRoll=lerp(shipRoll,Math.atan2(star-port,.8),1-Math.exp(-dt*4));
  ship.rotation.set(shipPitch,heading,shipRoll,'YXZ');
  wakeTimer+=dt;if(dt>0&&wakeTimer>.065){wakeTimer=0;const sternP=new THREE.Vector3(x-forward.x*.8,SEA+.06,z-forward.z*.8);emit(wake,sternP,new THREE.Vector3(-forward.x*.06,0,-forward.z*.06),2.4);
    for(let j=0;j<2+Math.round(state.storm*4);j++){const p=new THREE.Vector3(x+forward.x*.85+(rnd()-.5)*.16,ship.position.y+.08,z+forward.z*.85+(rnd()-.5)*.16);const v=new THREE.Vector3(forward.x*(.25+rnd()*.25)+(rnd()-.5)*.2,.35+rnd()*.45+state.storm*.45,forward.z*(.25+rnd()*.25)+(rnd()-.5)*.2);emit(spray,p,v,.45+rnd()*.35);}}
}
function updateDynamics(dt){
  updateShip(dt);
  for(let i=0;i<birds.length;i++){const b=birds[i],a=state.time*.34+b.phase;b.g.position.set(-1.7+Math.cos(a)*b.r,b.h+Math.sin(state.time*.9+b.phase)*.09,-.15+Math.sin(a)*b.r*.55);b.g.rotation.y=-a;const flap=Math.sin(state.time*8+b.phase)*.48;b.lw.rotation.z=flap;b.rw.rotation.z=-flap;}
  for(const c of clouds){c.g.position.x=c.baseX+Math.sin(state.time*c.speed)*.65;}
  const wp=(state.time%17)/17;const active=wp<.26;whale.visible=active;if(active){const p=wp/.26;whale.position.set(1.9+(p-.5)*1.35,SEA-.52+Math.sin(p*Math.PI)*1.38,-1.2);whale.rotation.z=(p-.5)*1.65;whale.rotation.y=-.25;}
  for(const b of buoys){b.g.position.set(b.x,SEA+waveHeight(b.x,b.z,state.time,state.storm)+.12,b.z);b.g.rotation.z=Math.sin(state.time*1.8+b.x)*.08*(1+state.storm);}
  boat.position.y=SEA+waveHeight(boat.position.x,boat.position.z,state.time,state.storm)+.13;boat.rotation.z=Math.sin(state.time*1.4)*.035;
  for(let i=0;i<fishCount;i++){const f=fishData[i],a=state.time*f.speed+f.phase;const x=f.center.x+Math.cos(a)*f.r,z=f.center.z+Math.sin(a)*f.r*.55,y=f.y+Math.sin(a*2)*.08;tempObj.position.set(x,y,z);tempObj.scale.set(.17,.07,.07);tempObj.rotation.set(0,-a,0);tempObj.updateMatrix();fishMesh.setMatrixAt(i*2,tempObj.matrix);tempObj.position.set(x-Math.cos(a)*.13,y,z-Math.sin(a)*.13);tempObj.scale.set(.09,.11,.025);tempObj.rotation.set(0,-a,.45);tempObj.updateMatrix();fishMesh.setMatrixAt(i*2+1,tempObj.matrix);}fishMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<bubbleCount;i++){const b=bubbleData[i];b.y+=dt*b.speed;if(b.y>SEA-.08)b.y=-2.75;const x=b.x+Math.sin(state.time+b.phase)*.04;tempObj.position.set(x,b.y,b.z);tempObj.scale.setScalar(.65+(i%4)*.16);tempObj.rotation.set(0,0,0);tempObj.updateMatrix();bubbleMesh.setMatrixAt(i,tempObj.matrix);}bubbleMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<crabs.length;i++)crabs[i].position.x+=Math.sin(state.time*2+i)*dt*.008;
  updateParticles(spray,dt,1.35);updateParticles(wake,dt,0);
}
function updateDay(dt){
  state.day=(state.day+dt/120)%1;const w=dayWeights(state.day);const night=clamp(w.night*1.4,0,1);const daylight=clamp(w.day+w.dawn*.55+w.dusk*.35,0,1);
  let label='子夜';if(state.day>=.15&&state.day<.4)label='黎明';else if(state.day>=.4&&state.day<.65)label='正午';else if(state.day>=.65&&state.day<.9)label='黄昏';phaseEl.textContent=label;
  waterUniforms.uNight.value=night;volumeMat.uniforms.uNight.value=night;glassMat.uniforms.uNight.value=night;waterUniforms.uSunDir.value.copy(sun.position).normalize();
  starMat.opacity=night*.9*(1-state.storm*.8);beamMat.opacity=.07+night*.24;lamp.intensity=2.2+night*6;houseLight.intensity=1+night*4;goldLight.intensity=2.5+night*2;treasureLight.intensity=1.5+night*2;
  hemi.intensity=.72+daylight*.8;key.intensity=1.25+daylight*2.2;roomGlow.intensity=28+w.dusk*24+night*12;
  const c=new THREE.Color(0x211e19);c.lerp(skyStops.night,night*.35);scene.background.copy(c);scene.fog.color.copy(c);
  const a=state.day*TAU-Math.PI*.5;sun.position.set(Math.cos(a)*4.15,1.05+Math.max(0,Math.sin(a))*1.35,-1.25);moon.position.set(Math.cos(a+Math.PI)*4.15,1.15+Math.max(0,Math.sin(a+Math.PI))*1.25,-1.3);
  sunMat.opacity=clamp(daylight*1.5,0,1);moonMat.opacity=night;sun.visible=daylight>.08;moon.visible=night>.08;
}
function updateStorm(dt){
  state.storm=lerp(state.storm,state.stormTarget,1-Math.exp(-dt*3.2));const s=state.storm;
  bottleRoot.rotation.x=Math.sin(state.real*2.6)*(.045+s*.055)*s;bottleRoot.rotation.z=0;
  innerWorld.quaternion.copy(bottleRoot.quaternion).invert();
  waterUniforms.uStorm.value=s;glassMat.uniforms.uStorm.value=s;
  cloudMat.color.set(0xe2ddcc).lerp(new THREE.Color(0x27343c),s);cloudMat.opacity=.88+s*.12;
  if(s>.25){if(state.lightning<=0&&rnd()<dt*(s>.8?1.2:.5))state.lightning=s>.8?.24:.16;}else state.lightning=0;
  state.lightning=Math.max(0,state.lightning-dt);const flash=state.lightning>0?Math.min(1,state.lightning/.16):0;lightningMat.opacity=flash*s;stormLight.intensity=flash*30*s;renderer.toneMappingExposure=1.05+flash*.3;
}
function auditContainment(){
  const probes=[ship.position,...birds.map(b=>b.g.position),...clouds.map(c=>c.g.position),whale.position,...buoys.map(b=>b.g.position)];
  return probes.every(p=>insideBottle(p,.05));
}
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const rawDt=Math.min((now-last)/1000,.05);last=now;state.real+=rawDt;const dt=rawDt*state.speed;state.time+=dt;
  updateStorm(rawDt);updateDay(dt);if(dt>0)updateDynamics(dt);else{updateParticles(spray,0);updateParticles(wake,0);}
  waterUniforms.uTime.value=state.time;volumeMat.uniforms.uTime.value=state.time;beamGroup.rotation.y=state.time*1.35;updateRain(rawDt);
  controls.update();renderer.render(scene,camera);
  frameCount++;fpsTime+=rawDt;if(fpsTime>=1){state.fps=Math.round(frameCount/fpsTime);fpsEl.textContent=state.fps+' FPS';fpsEl.style.color=state.fps>=50?'#9bbca7':'#d9b277';if(state.fps<46&&renderer.getPixelRatio()>1){lowFpsTime+=fpsTime;if(lowFpsTime>3){renderer.setPixelRatio(1);lowFpsTime=0;}}else lowFpsTime=0;frameCount=0;fpsTime=0;window.__BOTTLE_STATE__={fps:state.fps,drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,waterVerts:water.geometry.attributes.position.count,day:state.day,speed:state.speed,storm:state.storm,stormLevel:state.stormLevel,contained:auditContainment(),pixelRatio:renderer.getPixelRatio()};}
}
