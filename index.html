<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>瓶中沧海 · 写实版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8D%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loading"><div class="loader"></div><h2>正在注入一片沧海</h2><p id="loadStatus">加载 HDRI 与材质…</p><div id="loadError"></div></div>
<div id="ui">
  <div class="brand"><div class="eyebrow">A REALISTIC MINIATURE · Nº 160</div><h1>瓶中沧海</h1><div class="subtitle">An ocean, held in glass.</div></div>
  <div class="status">
    <div class="row"><span>时刻</span><strong id="phase">黄昏</strong></div>
    <div class="row"><span>海况</span><strong id="sailing">平静</strong></div>
    <div class="divider"></div>
    <div class="row"><span>流逝</span><strong id="speedRead">× 1</strong></div>
    <div class="row"><span>画质</span><strong id="qualityRead">高</strong></div>
    <div class="row"><span>帧率</span><strong id="fps">— FPS</strong></div>
  </div>
  <div id="stormBanner">风 暴 正 在 经 过</div>
  <div class="hint">拖动环视 · 滚轮缩放 · 闲置自动环绕</div>
  <div class="controls">
    <button data-speed="4">× 4</button><button data-speed="12">× 12</button><button data-speed="1" class="active">× 1</button><button data-speed="0">暂停</button>
    <div class="sep"></div>
    <button class="storm-btn" data-storm="1" title="点击开启或关闭风暴">风暴</button>
    <button class="storm-btn" data-storm="2" title="点击开启或关闭飓风">飓风</button>
    <button id="resetBtn" title="重置场景">重置</button>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
